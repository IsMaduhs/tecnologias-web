<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container-login">
    <h2>Criar Conta</h2>
    <div class="itens-input">
      <label>Nome Completo</label>
      <input type="text" placeholder="Seu nome">
    </div>
    <div class="itens-input">
      <label>E-mail</label>
      <input type="email" placeholder="seu@email.com">
    </div>
    <div class="itens-input">
      <label>Senha</label>
      <input type="password" placeholder="Criar senha">
    </div>
    <button id="btn-entrar" onclick="alert('Conta simulada com sucesso!'); window.location.href='login.html'">Cadastrar</button>
    <div class="links-login">
      <p>Já tem uma conta? <a href="login.html">Voltar ao Login</a></p>
    </div>
  </div>
</body>
</html>
